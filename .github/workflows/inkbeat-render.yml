name: inkbeat-render
on:
  workflow_dispatch:
  push:
    paths:
      - "inkbeat-bundle.tar.gz"
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project bundle
        run: tar xzf inkbeat-bundle.tar.gz && ls inkbeat/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: inkbeat
        run: npm install --no-audit --no-fund
      - name: Install full Chromium (Playwright) for WebGL
        working-directory: inkbeat
        run: |
          npx -y playwright@1.49.1 install --with-deps chromium
          ls -d $HOME/.cache/ms-playwright/chromium-*/chrome-linux/chrome
      - name: Smoke stills (WebGL proof, 3 frames)
        working-directory: inkbeat
        run: |
          CHROME=$(ls -d $HOME/.cache/ms-playwright/chromium-*/chrome-linux/chrome | head -1)
          echo "CHROME=$CHROME"
          for f in 10 300 580; do
            npx remotion still src/index.ts Molasses smoke-f$f.png --frame=$f --scale=0.5 --gl=angle --timeout=240000 --browser-executable=$CHROME
          done
          ls -la smoke-f*.png
          for f in 10 300 580; do test -s smoke-f$f.png; done
          echo "SMOKE OK: WebGL context works, 3 distinct stills written"
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-stills
          path: inkbeat/smoke-f*.png
  chunk:
    needs: smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { idx: 0, frames: "0-73" }
          - { idx: 1, frames: "74-147" }
          - { idx: 2, frames: "148-221" }
          - { idx: 3, frames: "222-295" }
          - { idx: 4, frames: "296-369" }
          - { idx: 5, frames: "370-443" }
          - { idx: 6, frames: "444-517" }
          - { idx: 7, frames: "518-591" }
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project bundle
        run: tar xzf inkbeat-bundle.tar.gz && ls inkbeat/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: inkbeat
        run: npm install --no-audit --no-fund
      - name: Install full Chromium (Playwright) for WebGL
        working-directory: inkbeat
        run: npx -y playwright@1.49.1 install --with-deps chromium
      - name: Render chunk
        working-directory: inkbeat
        run: |
          CHROME=$(ls -d $HOME/.cache/ms-playwright/chromium-*/chrome-linux/chrome | head -1)
          npx remotion render src/index.ts Molasses chunk-${{ matrix.idx }}.mp4 --frames=${{ matrix.frames }} --muted --gl=angle --timeout=240000 --concurrency=2 --crf=16 --browser-executable=$CHROME
      - name: Verify chunk frame count
        working-directory: inkbeat
        run: |
          n=$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 chunk-${{ matrix.idx }}.mp4)
          echo "chunk ${{ matrix.idx }} frames=$n"
          test "$n" = "74"
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.idx }}
          path: inkbeat/chunk-${{ matrix.idx }}.mp4
  finalize:
    needs: chunk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: chunks
      - name: Concat and publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R chunks
          for i in 0 1 2 3 4 5 6 7; do echo "file 'chunks/chunk-$i/chunk-$i.mp4'"; done > list.txt
          ffmpeg -y -v error -f concat -safe 0 -i list.txt -c:v libx264 -crf 16 -pix_fmt yuv420p -r 30 molasses-silent.mp4
          n=$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 molasses-silent.mp4)
          echo "final frames=$n"; test "$n" = "592"
          tag="inkbeat-molasses-${{ github.run_number }}"
          gh release create "$tag" molasses-silent.mp4 --repo ${{ github.repository }} --title "Inkbeat Molasses render ${{ github.run_number }}" --notes "Silent video; soundtrack is muxed locally."
          echo "RELEASE_TAG=$tag"
